<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sorter Setup</title>
<style>
  body { background:#050d18; color:#e6f1ff; font-family:'Share Tech Mono', monospace; margin:0; padding:2rem; }
  h1 { color:#00b4ff; font-family:'Orbitron', sans-serif; font-size:1.4rem; letter-spacing:0.05em; }
  #log { max-width:700px; margin-bottom:1rem; }
  .msg { margin:0.6rem 0; padding:0.6rem 0.8rem; border-radius:4px; white-space:pre-wrap; }
  .user { background:#0d1b2e; border-left:3px solid #00b4ff; }
  .agent { background:#0a1522; border-left:3px solid #4caf50; }
  form { max-width:700px; display:flex; gap:0.5rem; }
  input { flex:1; background:#0a1522; border:1px solid #1e3a5c; color:#e6f1ff; padding:0.6rem; font-family:inherit; }
  button { background:#00b4ff; color:#050d18; border:none; padding:0.6rem 1rem; font-family:inherit; cursor:pointer; }
</style>
</head>
<body>
<h1>SORTER // NEW INSTANCE</h1>
<div id="log"></div>
<form id="f">
  <input id="msg" autocomplete="off" placeholder="Create new sorting instance: intake folder based on ___" />
  <button type="submit">Send</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('msg');

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMsg(message, 'user');
  input.value = '';
  addMsg('...', 'agent');
  try {
    const res = await fetch('/setup/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();
    log.lastChild.remove();
    addMsg(data.reply || data.error || 'No response.', 'agent');
  } catch (err) {
    log.lastChild.remove();
    addMsg('Error: ' + err.message, 'agent');
  }
});
</script>
</body>
</html>
